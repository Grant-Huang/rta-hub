<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>RTA-Hub · 橱柜设计与报价</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
         background:#0f1216; color:#e6e8eb; height:100vh; display:flex; flex-direction:column; }
  header { padding:12px 20px; border-bottom:1px solid #262b33; display:flex; align-items:center; gap:12px; }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  .badge { font-size:11px; padding:2px 8px; border-radius:10px; background:#262b33; color:#9aa4b2; }
  /* 三栏：历史会话 / 主会话 / 产出物。宽度由 CSS 变量给，分隔条拖动时改变量。 */
  main { flex:1; display:grid; overflow:hidden; min-height:0;
         grid-template-columns: var(--rail-w,240px) 5px minmax(0,1fr) 5px var(--panel-w,520px); }
  /* 拖动条。命中区比视觉宽度大一点，否则很难抓住 */
  .gutter { background:#262b33; cursor:col-resize; position:relative; }
  .gutter::after { content:""; position:absolute; inset:0 -4px; }
  .gutter:hover, .gutter.dragging { background:#3a4250; }

  /* 左栏：历史会话 */
  .rail { display:flex; flex-direction:column; min-width:0; min-height:0; overflow:hidden; }
  .rail-head { padding:10px 12px; border-bottom:1px solid #262b33; display:flex; gap:8px; align-items:center; }
  .rail-head h2 { font-size:12px; margin:0; color:#9aa4b2; font-weight:500; flex:1; }
  .rail-list { flex:1; min-height:0; overflow-y:auto; padding:6px; }
  .conv { display:block; width:100%; text-align:left; background:none; border:1px solid transparent;
          border-radius:8px; padding:8px 10px; margin-bottom:3px; cursor:pointer; color:inherit; }
  .conv:hover { background:#1c2129; }
  .conv.active { background:#1e3566; border-color:#4d7bd7; }
  .conv .ct { font-size:12.5px; line-height:1.45; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .conv .cm { font-size:11px; color:#6a7382; margin-top:2px; }

  /* 中栏：主会话。`min-height:0` 不可省——flex 子项默认 min-height:auto，
     内容一长就把容器撑开，滚动条不出现、输入框被挤出可视区。 */
  .chat { display:flex; flex-direction:column; min-width:0; min-height:0; overflow:hidden; }
  .chat-log { flex:1; min-height:0; overflow-y:auto; padding:14px 14px 4px;
              display:flex; flex-direction:column; gap:9px; }
  .msg { max-width:92%; padding:8px 12px; border-radius:10px; font-size:13px; line-height:1.55; white-space:pre-wrap; }
  .msg.user { align-self:flex-end; background:#2a5bd7; color:#fff; }
  .msg.assistant { align-self:flex-start; background:#1c2129; }
  .msg.system { align-self:center; background:#2b2416; color:#d8c37b; font-size:12px; }
  /* 输入框贴着会话栏底部，不随消息流走 */
  .chat-input { display:flex; gap:8px; padding:11px; border-top:1px solid #262b33;
                background:#0f1216; flex:0 0 auto; }
  .chat-input input { flex:1; background:#1c2129; border:1px solid #262b33; color:inherit;
                      padding:8px 10px; border-radius:8px; font-size:13px; }
  button { background:#2a5bd7; border:none; color:#fff; padding:7px 13px; border-radius:8px;
           font-size:13px; cursor:pointer; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button.ghost { background:#262b33; }
  .panel { display:flex; flex-direction:column; min-width:0; min-height:0; overflow:hidden; }
  .steps { display:flex; gap:6px; padding:10px 16px; border-bottom:1px solid #262b33; flex-wrap:wrap; align-items:center; }
  .step { font-size:11px; padding:3px 9px; border-radius:10px; background:#1c2129; color:#6a7382; }
  .step.done { background:#1c3a2b; color:#7bd88f; }
  .step.active { background:#2a5bd7; color:#fff; }
  .toolbar { display:flex; align-items:center; gap:8px; padding:10px 16px;
             border-bottom:1px solid #262b33; flex-wrap:wrap; }
  .content { flex:1; min-height:0; overflow-y:auto; padding:16px; }
  /* 产出物下载条 */
  .downloads { display:flex; flex-wrap:wrap; gap:6px; padding:8px 16px; border-bottom:1px solid #262b33; }
  .dl { font-size:11.5px; padding:3px 9px; border-radius:8px; background:#262b33; color:#9aa4b2;
        text-decoration:none; border:1px solid #3a4250; cursor:pointer; }
  .dl:hover { border-color:#4d7bd7; color:#e6e8eb; }
  /* 会话里的快捷回答 chip */
  .quick { align-self:flex-start; max-width:92%; white-space:normal; }
  .quick .qh { font-size:11.5px; color:#8b94a3; margin:2px 0 5px; }
  .chip { background:#262b33; border:1px solid #3a4250; border-radius:14px; padding:4px 11px;
          font-size:12.5px; color:#e6e8eb; cursor:pointer; margin:0 5px 5px 0; }
  .chip:hover { border-color:#4d7bd7; }
  .chip.alt { background:none; border-style:dashed; color:#8b94a3;
              display:inline-block; max-width:100%; white-space:normal; text-align:left; line-height:1.45; }
  select, input[type=number] { background:#1c2129; border:1px solid #262b33; color:inherit;
           padding:6px 8px; border-radius:8px; font-size:13px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:6px; border-bottom:1px solid #1c2129; }
  th { color:#9aa4b2; font-weight:500; font-size:12px; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .totals { margin:14px 0 0 auto; width:290px; font-size:13px; }
  .totals div { display:flex; justify-content:space-between; padding:3px 0; }
  .totals .grand { border-top:1px solid #262b33; margin-top:6px; padding-top:8px; font-weight:600; font-size:15px; }
  .hint { color:#6a7382; font-size:12px; }
  .warn { font-size:12px; color:#d8c37b; padding:8px 16px; border-bottom:1px solid #262b33; }
  .card { background:#1c2129; border:1px solid #3a4250; border-radius:10px; padding:13px; margin-bottom:13px; }
  .card h3 { margin:0 0 8px; font-size:13px; }
  .views { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:10px; }
  .view { background:#fff; border-radius:8px; padding:6px; overflow:auto; }
  .view img, .view svg { max-width:100%; display:block; }
  .view .cap { color:#555; font-size:11px; text-align:center; padding-top:3px; }
  .q { display:flex; gap:8px; align-items:center; margin:6px 0; font-size:13px; }
  .q input { width:90px; }
  .status-pill { font-size:11px; padding:2px 8px; border-radius:10px; background:#262b33; }
  .status-pill.confirmed { background:#1c3a4d; color:#7bc0d8; }
  .status-pill.sent { background:#1c4d2b; color:#7bd88f; }
  .status-pill.failed { background:#4d3f1c; color:#d8c37b; }
  .err { color:#d87b7b; font-size:12px; white-space:pre-wrap; }
  .cmp-lowest { color:#7bd88f; }
  /* 选择题卡片里是**结构化标记**，不是聊天正文。
     `.msg` 的 white-space:pre-wrap 会把模板字符串里的换行与缩进原样画出来，
     卡片被撑成两倍高、选项之间隔着大片空白——正文需要 pre-wrap，卡片不需要。 */
  .qcard { background:#1c2129; border:1px solid #3a4250; border-radius:10px; padding:12px; margin:8px 0;
           white-space:normal; }
  .qcard .qp { font-size:13px; font-weight:600; margin-bottom:4px; }
  .qcard .qw { font-size:11.5px; color:#8b94a3; line-height:1.5; margin-bottom:9px; }
  .opts { display:flex; flex-wrap:wrap; gap:7px; }
  .opt { text-align:left; background:#262b33; border:1px solid #3a4250; border-radius:9px;
         padding:7px 10px; cursor:pointer; font-size:12.5px; color:#e6e8eb; line-height:1.4; }
  .opt:hover { border-color:#4d7bd7; }
  .opt.sel { background:#1e3566; border-color:#4d7bd7; }
  .opt .ol { display:block; font-weight:500; }
  .opt .od { display:block; color:#8b94a3; font-size:11px; }
  .opt .op { display:block; color:#7bc0d8; font-size:11px; margin-top:2px; }
  .opt .rec { color:#7bd88f; font-size:10.5px; }
  .qskip { background:none; border:none; color:#6a7382; font-size:11.5px;
           cursor:pointer; padding:6px 0 0; text-decoration:underline; }
  .x-rationale h4, .x-guide h4 { font-size:12.5px; margin:12px 0 5px; color:#9aa4b2; }
  .x-guide h5 { font-size:12.5px; margin:10px 0 3px; }
  .x-rationale .x-head { font-size:13px; margin:0 0 4px; }
  .x-rationale ul, .x-guide ul { margin:0; padding-left:16px; }
  .x-rationale li, .x-guide li, .x-guide p { font-size:12.5px; line-height:1.65; margin:2px 0; }
  .x-rationale li { list-style:none; position:relative; padding-left:14px; margin-left:-16px; }
  .x-rationale li::before { position:absolute; left:0; }
  .x-fact { color:#8b94a3; } .x-fact::before { content:"·"; color:#6a7382; }
  .x-good { color:#c6cdd6; } .x-good::before { content:"✓"; color:#7bd88f; }
  .x-tradeoff { color:#c6cdd6; } .x-tradeoff::before { content:"△"; color:#d8c37b; }
  .x-warn { color:#e0b4b4; } .x-warn::before { content:"!"; color:#d87b7b; font-weight:700; }
  .x-guide p { color:#8b94a3; }
  details.x-more { margin-top:10px; }
  details.x-more > summary { cursor:pointer; font-size:12px; color:#7bc0d8; }
</style>
</head>
<body>
<header>
  <h1>RTA-Hub · 橱柜设计与报价</h1>
  <select id="acctSel" title="演示用账号切换">
    <option value="ca_demo_consumer">消费者账号</option>
    <option value="ca_demo_trade">建商账号（trade）</option>
  </select>
  <span class="badge" id="acctBadge">consumer</span>
  <span style="flex:1"></span>
  <button class="ghost" id="projBtn" style="display:none">我的项目</button>
  <span class="badge" id="sendBadge">预览模式</span>
</header>
<main>
  <aside class="rail">
    <div class="rail-head">
      <h2>历史会话</h2>
      <button class="ghost" id="newConvBtn" title="开一段新会话">＋ 新建</button>
    </div>
    <div class="rail-list" id="convList"><p class="hint" style="padding:8px">还没有会话。</p></div>
  </aside>
  <div class="gutter" id="gutterL" title="拖动调整宽度"></div>

  <section class="chat">
    <div class="chat-log" id="chatLog">
      <div class="msg assistant">你好，我是橱柜设计顾问。先聊聊你的项目——厨房大概多大？喜欢什么风格？预算范围？所在省份？

想问某家公司的具体细节，用 <b>@公司名</b> 点名（例如 @枫岭橱柜 / @湖畔厨柜）。</div>
    </div>
    <form class="chat-input" id="chatForm">
      <input id="chatInput" placeholder="说说你的需求，或 @某家公司…" autocomplete="off" />
      <button type="submit">发送</button>
    </form>
  </section>
  <div class="gutter" id="gutterR" title="拖动调整宽度"></div>

  <section class="panel">
    <div class="warn">报价发送前会列出将要提供给该公司的全部信息，需你确认后才会发出。系统不会自动发送。</div>
    <div class="steps" id="steps"></div>
    <div class="downloads" id="downloads"><span class="hint">产出物会出现在这里，可单独下载。</span></div>
    <div class="toolbar">
      <button id="uploadBtn" class="ghost">① 上传户型图</button>
      <select id="companySel"></select>
      <select id="doorSel"></select>
      <button id="layoutBtn" disabled>② 生成方案</button>
      <button id="quoteBtn" disabled>③ 出报价</button>
      <button id="prefBtn" class="ghost">偏好与预算</button>
      <button id="cmpBtn" class="ghost">比价</button>
      <span style="flex:1"></span>
      <span class="status-pill" id="quoteStatus" style="display:none"></span>
    </div>
    <div class="content" id="content">
      <p class="hint">流程：上传户型图 → 补齐尺寸 → 自动排布出四视图 → 生成报价 → 确认发送。<br/>
        没有配置视觉模型时，上传后会引导你手动录入墙段尺寸。</p>
    </div>
  </section>
</main>

<script>
let ACCOUNT = 'ca_demo_consumer';
const $ = (id) => document.getElementById(id);
let conversationId = null, floorPlanId = null, layout = null, currentQuote = null, spec = null;
let profile = null;

const api = async (path, opts = {}) => {
  const res = await fetch(path, {
    ...opts,
    headers: { 'content-type': 'application/json', 'x-account-id': ACCOUNT, ...(opts.headers || {}) },
  });
  const body = await res.json().catch(() => ({}));
  return { ok: res.ok, status: res.status, body };
};
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const money = (c) => '$' + (c / 100).toFixed(2).replace(/\B(?=(\d{3})+(?!\.))/g, ',');

const STEPS = ['户型图', '尺寸补齐', '方案与四视图', '报价', '确认发送'];
let stepIndex = 0;
function renderSteps() {
  $('steps').innerHTML = STEPS.map((s, i) =>
    `<span class="step ${i < stepIndex ? 'done' : i === stepIndex ? 'active' : ''}">${i + 1}. ${esc(s)}</span>`
  ).join('');
}

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  $('chatLog').appendChild(div);
  scrollChatToBottom();
  return div;
}

/** 新内容出现后滚到底。输入框是固定的，滚的只是消息流。 */
function scrollChatToBottom() {
  const log = $('chatLog');
  log.scrollTop = log.scrollHeight;
}

// ── 快捷回答 chip ─────────────────────────────────────────────────────────
//
// 「您偏好的厨房风格是什么？」这类开放式问题，客户读完不知道答案该有多长。
// 服务端随回复给出 `quickReplies`（agents/quick-replies.ts）：一句"回一个词就行"
// 的提示 + 几个可点选项。**chip 上的字就是点下去发出去的那句话**，
// 不是标签——服务端保证它能被需求识别认出来，否则客户点了还会被问第二遍。

let quickBlock = null;

function renderQuickReplies(quick) {
  if (quickBlock) { quickBlock.remove(); quickBlock = null; }
  if (!quick || quick.length === 0) return;

  const box = document.createElement('div');
  box.className = 'quick';
  box.innerHTML = quick.map((q) => `
    <div class="qh">${esc(q.hint)}</div>
    <div>${q.options.map((o) => `<button class="chip" data-send="${esc(o)}">${esc(o)}</button>`).join('')}
      ${q.alternative ? `<span class="chip alt" data-upload="1">${esc(q.alternative)}</span>` : ''}</div>`).join('');
  box.addEventListener('click', (e) => {
    const chip = e.target.closest('[data-send]');
    if (chip) { sendChat(chip.dataset.send); return; }
    if (e.target.closest('[data-upload]')) $('uploadBtn').click();
  });
  $('chatLog').appendChild(box);
  quickBlock = box;
  scrollChatToBottom();
}

// ── 产出物下载 ────────────────────────────────────────────────────────────
//
// 右栏是产出物栏：图纸、报价单、PDF。每一样都要能**单独拿走**——
// 客户要把图发给装修队、把报价单发给业主，靠截屏是不行的。

const artifacts = [];

/**
 * 登记一件产出物。
 *
 * `source` 要么是一段内容（字符串），要么是 `{ url }`——服务端生成的那些
 * （报价单 PDF）走 url。**url 不能直接 window.open**：账号是靠请求头带的，
 * 新开标签页没有那个头，服务端会 401。所以统一走 fetch。
 */
function registerArtifact(name, mime, source) {
  const i = artifacts.findIndex((a) => a.name === name);
  const entry = { name, mime, source };
  if (i >= 0) artifacts[i] = entry; else artifacts.push(entry);
  renderDownloads();
}

function renderDownloads() {
  const box = $('downloads');
  if (artifacts.length === 0) {
    box.innerHTML = '<span class="hint">产出物会出现在这里，可单独下载。</span>';
    return;
  }
  box.innerHTML = artifacts
    .map((a, i) => `<span class="dl" data-dl="${i}">⤓ ${esc(a.name)}</span>`).join('');
}

$('downloads').addEventListener('click', async (e) => {
  const el = e.target.closest('[data-dl]');
  if (!el) return;
  const a = artifacts[Number(el.dataset.dl)];
  if (!a) return;

  let blob;
  if (typeof a.source === 'object' && a.source.url) {
    const res = await fetch(a.source.url, { headers: { 'x-account-id': ACCOUNT } });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      $('content').insertAdjacentHTML('afterbegin',
        `<div class="err">${esc(body.error || '下载失败')}</div>`);
      return;
    }
    blob = await res.blob();
  } else {
    blob = new Blob([typeof a.source === 'function' ? a.source() : a.source], { type: a.mime });
  }
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url; link.download = a.name;
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});

function clearArtifacts() { artifacts.length = 0; renderDownloads(); }

// ── 分栏拖动 ──────────────────────────────────────────────────────────────
//
// 三栏宽度是 CSS 变量，拖动改变量。宽度记在 localStorage：
// 每次刷新都要重新拖一遍的话，这个功能等于没有。

function setupGutter(id, varName, edge, min, max) {
  const saved = Number(localStorage.getItem(varName));
  if (saved >= min && saved <= max) document.documentElement.style.setProperty(varName, saved + 'px');

  $(id).addEventListener('pointerdown', (down) => {
    down.preventDefault();
    const el = $(id);
    el.classList.add('dragging');
    el.setPointerCapture(down.pointerId);
    const move = (e) => {
      const w = edge === 'left' ? e.clientX : window.innerWidth - e.clientX;
      const clamped = Math.min(max, Math.max(min, Math.round(w)));
      document.documentElement.style.setProperty(varName, clamped + 'px');
    };
    const up = () => {
      el.classList.remove('dragging');
      el.removeEventListener('pointermove', move);
      el.removeEventListener('pointerup', up);
      const cur = document.documentElement.style.getPropertyValue(varName);
      localStorage.setItem(varName, parseInt(cur, 10) || '');
    };
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up);
  });
}
setupGutter('gutterL', '--rail-w', 'left', 160, 480);
setupGutter('gutterR', '--panel-w', 'right', 320, 900);

// ── 左栏：历史会话 ────────────────────────────────────────────────────────

async function refreshConversations() {
  const { body } = await api('/api/conversations');
  const list = body.conversations || [];
  if (list.length === 0) {
    $('convList').innerHTML = '<p class="hint" style="padding:8px">还没有会话。</p>';
    return;
  }
  $('convList').innerHTML = list.map((v) => `
    <button class="conv ${v.id === conversationId ? 'active' : ''}" data-conv="${esc(v.id)}">
      <span class="ct">${esc(v.title)}</span>
      <span class="cm">${v.messageCount} 条${v.quoteCount ? ` · ${v.quoteCount} 份报价` : ''}</span>
    </button>`).join('');
}

$('convList').addEventListener('click', async (e) => {
  const el = e.target.closest('[data-conv]');
  if (!el || el.dataset.conv === conversationId) return;
  await openConversation(el.dataset.conv);
});

/** 切到另一段会话：重放它的消息，产出物栏清空（那是上一段会话的东西）。 */
async function openConversation(id) {
  const { ok, body } = await api(`/api/conversations/${id}`);
  if (!ok) return;
  conversationId = id;
  floorPlanId = null; layout = null; currentQuote = null;
  stepIndex = 0; renderSteps();
  clearArtifacts();
  quickBlock = null;
  $('layoutBtn').disabled = true; $('quoteBtn').disabled = true;
  const history = body.conversation.messages || [];
  $('content').innerHTML = history.length
    ? '<p class="hint">已切到这段会话。产出物需要重新生成——图纸与报价都带着时间戳，不能跨会话复用。</p>'
    : '<p class="hint">流程：上传户型图 → 补齐尺寸 → 自动排布出四视图 → 生成报价 → 确认发送。</p>';
  $('chatLog').innerHTML = '';
  if (history.length === 0) {
    addMsg('assistant', '你好，我是橱柜设计顾问。先聊聊你的项目——厨房大概多大？喜欢什么风格？预算范围？所在省份？\n\n想问某家公司的具体细节，用 @公司名 点名（例如 @枫岭橱柜 / @湖畔厨柜）。');
  }
  for (const m of history) addMsg(m.role, m.content);
  await refreshConversations();
  scrollChatToBottom();
}

$('newConvBtn').addEventListener('click', async () => {

/**
 * 接着上一段会话，没有才新建。
 *
 * 每次刷新都 POST 一段新会话的话，左栏很快就堆满**一条消息都没有的空会话**——
 * 历史列表变成刷新次数的计数器。有历史就接着上一段，那也是人打开一个
 * 聊天界面时期望看到的。
 */
async function resumeOrCreateConversation() {
  const { body } = await api('/api/conversations');
  const latest = (body.conversations || [])[0];
  if (latest) { await openConversation(latest.id); return; }
  const created = await api('/api/conversations', { method: 'POST' });
  conversationId = created.body.conversation?.id ?? null;
  await refreshConversations();
}

 * 不是账号自己声明的类型——资质没过审的 trade 账号按零售价出单，

const PROJECT_STATUS = {
  collecting: '收集需求', designing: '已出方案', quoted: '已报价',
  sent: '已发送', dormant: '沉寂',
};

async function renderProjects() {
  const { body } = await api('/api/me/projects');
  const projects = body.projects || [];
  const p = body.portfolio || { byStatus: {} };

  const rows = projects.map((x) => `<tr>

    <td class="num">${x.companyCount}</td>
    <td class="num">${x.quoteCount}</td>

    </div>
    ${renderTradeGate()}`;

}

/** 贸易价门槛的当前状态——不允许显示成"已享贸易价"却按零售价出单。 */
function renderTradeGate() {
  if (!profile || profile.accountType !== 'trade') return '';
  const gate = profile.tradePricing || {};
  if (gate.allowed) {
    return `<div class="card"><h3>贸易价已生效</h3>
      <p class="hint">资质已通过审核，订阅有效。报价按贸易价计算，折扣明细会逐项列出。</p></div>`;
  }
  const form = gate.nextStep === 'submitVerification' || gate.nextStep === 'resubmit'
    ? `<div class="q"><input id="legalName" placeholder="公司注册名称" style="width:200px" /></div>
       <div class="q"><input id="bizNumber" placeholder="营业执照号 / GST 号" style="width:200px" /></div>
       <button id="verifyBtn">提交资质核实</button>
       <p class="hint" style="margin-top:8px">只需要编号与注册名，<b>不需要上传证件影像</b>——
       核实只需一个可查证的号码，留存影像会平白扩大泄露面。</p>`
    : '';
  return `<div class="card">
    <h3>当前按零售价报价</h3>
    <p class="hint">${esc(gate.reason || '')}</p>
    ${form}</div>`;
}

/** 发一句话。输入框与快捷回答 chip 走的是同一条路——chip 就是替客户打了那句话。 */
async function sendChat(text) {
  if (!text || !conversationId) return;
  if (quickBlock) { quickBlock.remove(); quickBlock = null; }
  addMsg('user', text);
  const { body } = await api(`/api/conversations/${conversationId}/messages`, {
    method: 'POST', body: JSON.stringify({ text }),
  });
  for (const r of body.replies || []) addMsg('assistant', r.content);
  if (!body.replies?.length) addMsg('assistant', body.error || '（无响应）');
  renderQuickReplies(body.quickReplies || []);
  renderQuestions(body.questions || [], body.questionCompanyId || $('companySel').value);
  refreshConversations();
}

// ── 价格与偏好的选择题 ────────────────────────────────────────────────────
//
// 客户不知道一套橱柜该是多少钱，也不知道 shaker 和 raised panel 差多少。
// 与其开放式提问，不如把选项和**算出来的**价格影响摆出来让他选。
// 选项与价格一律来自服务端（真实规格库 + 定价引擎），前端只负责渲染。

let pendingQuestions = [];
/** 会话里当前那张选择题卡片。换新卡时把旧的摘掉。 */
let questionBlock = null;

function renderQuestions(questions, companyId) {
  pendingQuestions = questions;
  if (!questions.length) return;

  // 只留最新的一张。上一轮没答的题会随本轮回复再发一次——两张一模一样的卡片
  // 叠在会话里，客户不知道该点哪张，答完另一张还留在那儿。
  if (questionBlock) { questionBlock.remove(); questionBlock = null; }

  const box = document.createElement('div');
  box.className = 'msg assistant';
  box.style.maxWidth = '100%';
  box.style.whiteSpace = 'normal'; // 里面是卡片标记，不是聊天正文
  box.innerHTML = questions.map((q, qi) => `
    <div class="qcard" data-q="${qi}">
      <div class="qp">${esc(q.prompt)}</div>
      <div class="qw">${esc(q.why)}</div>
      <div class="opts">${q.options.map((o, oi) => `
        <button class="opt" data-q="${qi}" data-o="${oi}">
          <span class="ol">${esc(o.label)}${o.recommended ? ' <span class="rec">· 常见选择</span>' : ''}</span>
          ${o.detail ? `<span class="od">${esc(o.detail)}</span>` : ''}
          <span class="op">${esc(o.priceNote)}</span>
        </button>`).join('')}</div>
      ${q.multiSelect ? '<button class="qskip" data-done="' + qi + '">选好了 / 都不需要</button>'
                      : q.skippable ? '<button class="qskip" data-skip="' + qi + '">跳过这一题</button>' : ''}
    </div>`).join('');

  box.addEventListener('click', (e) => {
    const opt = e.target.closest('.opt');
    if (opt) return onOptionClick(opt, companyId);
    const done = e.target.closest('[data-done]');
    if (done) return submitMulti(Number(done.dataset.done), companyId, done);
    const skip = e.target.closest('[data-skip]');
    if (skip) skip.closest('.qcard').remove();
  });

  $('chatLog').appendChild(box);
  questionBlock = box;
  scrollChatToBottom();
}

function onOptionClick(btn, companyId) {
  const q = pendingQuestions[Number(btn.dataset.q)];
  const opt = q.options[Number(btn.dataset.o)];
  if (q.multiSelect) { btn.classList.toggle('sel'); return; }
  // 单选：立即提交并把这一题收起来
  btn.closest('.opts').querySelectorAll('.opt').forEach((b) => b.classList.remove('sel'));
  btn.classList.add('sel');
  savePreference(q.key, opt.id, companyId, btn.closest('.qcard'), opt.label);
}

function submitMulti(qi, companyId, doneBtn) {
  const card = doneBtn.closest('.qcard');
  const ids = [...card.querySelectorAll('.opt.sel')].map((b) =>
    pendingQuestions[qi].options[Number(b.dataset.o)].id);
  const labels = [...card.querySelectorAll('.opt.sel')].map((b) =>
    pendingQuestions[qi].options[Number(b.dataset.o)].label);
  savePreference(pendingQuestions[qi].key, ids, companyId, card,
    labels.length ? labels.join('、') : '都不需要');
}

/** 偏好 key → 请求体字段。多选题传数组。 */
const PREF_FIELD = {
  budgetBand: 'budgetBand', doorStyle: 'doorStyleId', assembly: 'assembly',
  storage: 'storage', hardware: 'hardwareOptionIds', accessories: 'accessoryOptionIds',
  tradeoff: 'tradeoff',
};

async function savePreference(key, value, companyId, card, label) {
  const { ok, body } = await api(`/api/conversations/${conversationId}/preferences`, {
    method: 'POST',
    body: JSON.stringify({ companyId, [PREF_FIELD[key]]: value }),
  });
  if (!ok) {
    card.insertAdjacentHTML('beforeend', `<div class="err">${esc(body.error)}</div>`);
    return;
  }
  card.innerHTML = `<div class="qw">已记录：<b style="color:#e6e8eb">${esc(label)}</b>` +
    (body.layoutAffected ? '　<span style="color:#d8c37b">（会改变排布，重新生成方案后生效）</span>' : '') +
    '</div>';
  // 门板一旦选定，下游的报价就用它——顺手同步到下拉框，免得两处不一致
  if (key === 'doorStyle') $('doorSel').value = value;
}

$('uploadBtn').addEventListener('click', async () => {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*,.pdf';
  input.addEventListener('change', async () => {
    const file = input.files?.[0];
    const { body } = await api(`/api/conversations/${conversationId}/floorplan`, {
      method: 'POST',
      body: JSON.stringify({
        fileName: file?.name ?? 'floorplan.png',
        mimeType: file?.type ?? 'image/png',
        sizeBytes: file?.size ?? 0,
      }),
    });
    floorPlanId = body.floorPlan?.id;

    renderFloorPlan(body);

});

function renderFloorPlan(body) {
  const questions = body.questions || [];
  const runs = body.floorPlan?.parsedGeometry?.wallRuns || [];
  const runRows = runs.map((r) => `<tr><td>${esc(r.label)}</td><td class="num">${r.length}"</td></tr>`).join('');

  $('content').innerHTML = `
    <div class="card">
      <h3>户型信息 ${body.ready ? '<span class="status-pill sent">已就绪</span>' : '<span class="status-pill">待补齐</span>'}</h3>
      ${runs.length ? `<table><thead><tr><th>墙段</th><th class="num">长度</th></tr></thead><tbody>${runRows}</tbody></table>` : ''}
      ${questions.length ? `
        <p class="hint" style="margin-top:10px">系统对拿不准的地方逐条追问，不会静默跳过任何一段墙：</p>
        ${questions.map((q) => `<div class="q">· ${esc(q.question)}</div>`).join('')}
        <div class="q" style="margin-top:10px">
          <span>加一段墙：</span>
          <input id="runLabel" placeholder="如 北墙" style="width:110px" />
          <input id="runLen" type="number" placeholder="英寸" />
          <button id="addRunBtn">添加</button>
        </div>
        <div class="q">
          <span>天花板高度：</span>
          <input id="ceil" type="number" value="96" />
          <button id="ceilBtn">确认</button>
        </div>` : ''}
    </div>`;

  if ($('addRunBtn')) {
    $('addRunBtn').addEventListener('click', () => resolveFp({
      addRun: { label: $('runLabel').value || '墙段', length: Number($('runLen').value) || 0 },
    }));
    $('ceilBtn').addEventListener('click', () => resolveFp({ ceilingHeight: Number($('ceil').value) }));
  }
  $('layoutBtn').disabled = !body.ready;
  if (body.ready) { stepIndex = 2; renderSteps(); }
}

async function resolveFp(patch) {
  const { body } = await api(`/api/floorplans/${floorPlanId}/resolve`, {
    method: 'POST', body: JSON.stringify(patch),
  });
  renderFloorPlan(body);
}

// ── ② 生成方案 ──
$('layoutBtn').addEventListener('click', async () => {

    return;
  }
  layout = body;
  stepIndex = 3; renderSteps();
  renderLayout(body);
});

const VIEW_NAMES = { front: '正视图', topBase: '俯视图 · 地柜层', topWall: '俯视图 · 吊柜层', side: '侧视图' };

const SCORE_LABELS = {
  widthRhythm: '宽度节奏', narrowPenalty: '避免窄柜',
  seamAlignment: '上下对缝', symmetry: '对称性', fillerPlacement: '填缝条位置',
};

function renderLayout(body) {
  const counts = body.moduleCounts.map((m) =>
    `<tr><td>${esc(m.moduleCode)}</td><td class="hint">${m.width}"×${m.height}"×${m.depth}"</td><td class="num">${m.qty}</td></tr>`).join('');
  const warns = (body.warnings || []).map((w) => `<div class="err">· ${esc(w.message)}</div>`).join('');

  // 人体工程：blocking 会挡住出报价，advisory 只是提醒
  const blocking = (body.ergonomics || []).filter((v) => v.severity === 'blocking');
  const advisory = (body.ergonomics || []).filter((v) => v.severity === 'advisory');
  const ergoBlock = blocking.length ? `
    <div class="card" style="border-color:#7a3a3a">
      <h3>⛔ 这版方案用起来有问题，需要先调整</h3>
      ${blocking.map((v) => `<div class="err">· ${esc(v.message)}</div>`).join('')}
      <p class="hint">这些是安全与使用便利的底线（依据北美 NKBA 厨房规划指南），不是省钱与否的取舍，所以暂时不能出报价。</p>
    </div>` : '';
  const advisoryBlock = advisory.length ? `
    <div class="card">
      <h3>建议</h3>
      ${advisory.map((v) => `<div class="hint">· ${esc(v.message)}</div>`).join('')}
    </div>` : '';

  const scoreBlock = (body.aesthetics || []).map((a) => {
    const b = a.score.breakdown;
    const bars = Object.entries(SCORE_LABELS).map(([k, label]) => {
      const pct = Math.round((b[k] ?? 0) * 100);
      return `<div style="display:flex;align-items:center;gap:8px;font-size:12px;margin:3px 0">
        <span style="width:70px;color:#9aa4b2">${label}</span>
        <span style="flex:1;height:6px;background:#262b33;border-radius:3px;overflow:hidden">
          <span style="display:block;height:100%;width:${pct}%;background:${pct >= 80 ? '#4c9a5f' : pct >= 50 ? '#8a7b3a' : '#8a4a4a'}"></span>
        </span>
        <span style="width:34px;text-align:right;color:#6a7382">${pct}%</span></div>`;
    }).join('');
    const notes = (a.score.notes || []).map((n) => `<div class="hint">· ${esc(n)}</div>`).join('');
    return `<div class="card">
      <h3>排布质量 <span class="status-pill">${a.score.total} / 100</span></h3>
      ${bars}${notes ? `<div style="margin-top:8px">${notes}</div>` : ''}
      <p class="hint" style="margin-top:8px">评分只影响观感，不影响能否下单；上面的 ⛔ 项才是硬性要求。</p>
    </div>`;
  }).join('');
  // 图纸解释：这是什么图（全局一份）+ 为什么这么排（每段墙一份）。
  // 服务端已经算好并转义好了，这里直接插入。
  const exp = body.explanation || {};
  const rationaleOf = (runId) =>
    (exp.perRun || []).find((x) => x.runId === runId)?.html || '';

  // 每段墙的四视图各注册成一个可下载的 SVG。客户要把图发给装修队，
  // 右栏只能看是不够的。
  for (const r of body.views) {
    for (const k of ['front', 'topBase', 'topWall', 'side']) {
      const svg = r.views[k];
      if (svg) registerArtifact(`${r.runLabel}-${VIEW_NAMES[k]}.svg`, 'image/svg+xml', svg);
    }
  }

  const viewBlocks = body.views.map((r) => `
    <div class="card">
      <h3>${esc(r.runLabel)}</h3>
      <div class="views">
        ${['front','topBase','topWall','side'].map((k) => `
          <div class="view">${r.views[k]}<div class="cap">${VIEW_NAMES[k]}</div></div>`).join('')}
      </div>
      ${rationaleOf(r.runId)}
      <div style="margin-top:8px">
        <button class="ghost" data-run="${esc(r.runId)}" onclick="regen(this.dataset.run)">重新排布这段墙</button>
      </div>
    </div>`).join('');

  // 「怎么看这几张图」默认折叠——第一次看的人需要，看过的人不需要每次都看
  const guideBlock = exp.viewGuideHtml
    ? `<div class="card"><details class="x-more" open>
         <summary>第一次看这几张图？点开有说明</summary>
         ${exp.viewGuideHtml}
       </details></div>`
    : '';

  $('content').innerHTML = `
    ${ergoBlock}
    <div class="card">
      <h3>排布结果（按该公司真实型号与离散尺寸）</h3>
      <table><thead><tr><th>型号</th><th>规格</th><th class="num">数量</th></tr></thead><tbody>${counts}</tbody></table>
      ${warns}
    </div>
    ${scoreBlock}
    ${advisoryBlock}
    ${guideBlock}
    ${viewBlocks}`;

  // 硬约束没过就不让往下走
  $('quoteBtn').disabled = body.acceptable === false;
}

window.regen = async (wallRunId) => {

// ── ③ 出报价 ──
$('quoteBtn').addEventListener('click', async () => {
  if (!layout) return;
  const { ok, body } = await api('/api/quotes', {
    method: 'POST',
    body: JSON.stringify({
      companyId: $('companySel').value, conversationId,
      doorStyleId: $('doorSel').value, selections: layout.selections,
    }),
  });
  if (!ok) {
    const detail = (body.issues || []).map((i) => `${i.code}: ${i.message}`)
      .concat((body.ergonomics || []).map((v) => v.message))
      .join('\n');
    $('content').innerHTML = `<div class="err">报价被拒绝：\n${esc(detail || body.error)}</div>`;

  }
  currentQuote = body.quote;
  lastTradeNotice = body.tradePricing || null;
  stepIndex = 4; renderSteps();
  renderQuote();
  // 正式报价单进产出物栏。走服务端的 PDF 端点，与邮件附件是同一份——
  // 前端另拼一份的话，"客户下载的"和"公司收到的"会是两个文件。
  registerArtifact(`报价单-${currentQuote.id}.pdf`, 'application/pdf',
    { url: `/api/quotes/${currentQuote.id}/pdf` });
});

let lastTradeNotice = null;

function renderQuote() {
  const q = currentQuote;
  $('quoteStatus').style.display = '';
  $('quoteStatus').className = 'status-pill ' + q.status;
  $('quoteStatus').textContent = q.status;

  const rows = q.lineItems.map((l) => `<tr>
    <td>${esc(l.moduleCode)}</td>
    <td class="hint">${l.width}" × ${l.height}" × ${l.depth}"</td>
    <td class="num">${l.qty}</td>
    <td class="num">${money(l.unitListPrice)}</td>
    <td class="num">${money(l.unitNetPrice)}</td>
    <td class="num">${money(l.lineSubtotal)}</td></tr>`).join('');

  $('content').innerHTML = `
    <table>
      <thead><tr><th>型号</th><th>规格</th><th class="num">数量</th>
        <th class="num">标价</th><th class="num">折后单价</th><th class="num">小计</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="totals">
      <div><span>小计</span><span>${money(q.subtotal)}</span></div>
      ${q.discounts.map((d) => `<div><span>${esc(d.description)}</span><span>-${money(d.amount)}</span></div>`).join('')}
      <div><span>运费</span><span>${money(q.shipping.amount)}</span></div>
      ${q.taxes.map((t) => `<div><span>${esc(t.name)} ${t.ratePercent}%</span><span>${money(t.amount)}</span></div>`).join('')}
      <div class="grand"><span>总计（${esc(q.currency)}）</span><span>${money(q.total)}</span></div>
      <div class="hint" style="justify-content:flex-end">有效期至 ${esc(q.validUntil.slice(0,10))}</div>
    </div>
    ${lastTradeNotice && !lastTradeNotice.applied ? `<div class="card" style="margin-top:14px">
      <h3>本单按零售价计算</h3>
      <p class="hint">${esc(lastTradeNotice.reason)}</p></div>` : ''}
    <div style="margin-top:18px">
      <button id="discBtn">下一步：查看将发送的内容</button>
      <button class="ghost" id="pdfBtn">下载 PDF 报价单</button>
    </div>
    <div id="discBox"></div>`;
  $('discBtn').addEventListener('click', showDisclosure);
  $('pdfBtn').addEventListener('click', downloadPdf);
}

/**
 * 下载正式报价单 PDF —— 与邮件附件是同一份，避免"客户看到的"和"公司收到的"不一致。
 * 没有关联方案时服务端返回 409，这里如实说明而不是给一个空文件。
 */
async function downloadPdf() {
  const res = await fetch(`/api/quotes/${currentQuote.id}/pdf`, { headers: { 'x-account-id': ACCOUNT } });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    $('discBox').innerHTML = `<div class="err">${esc(body.error || '生成 PDF 失败')}</div>`;
    return;
  }
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${currentQuote.id}.pdf`;
  a.click();
  URL.revokeObjectURL(url);
}

async function showDisclosure() {
  const { body } = await api(`/api/quotes/${currentQuote.id}/disclosure`);
  $('discBox').innerHTML = `
    <div class="card" style="margin-top:14px">
      <h3>以下内容将发送给「${esc(body.companyName)}」</h3>
      <ul class="hint" style="line-height:1.7">${body.items.map((i) => `<li>${esc(i.label)}：${esc(i.value)}</li>`).join('')}</ul>
      <p class="hint">${esc(body.notice)}</p>
      <button id="confirmBtn">我已阅读，确认发送</button>
      <button class="ghost" id="cancelBtn">取消</button>
    </div>`;
  $('cancelBtn').addEventListener('click', () => { $('discBox').innerHTML = ''; });
  $('confirmBtn').addEventListener('click', doConfirmAndSend);
}

async function doConfirmAndSend() {
  const c = await api(`/api/quotes/${currentQuote.id}/confirm`, { method: 'POST' });
  if (!c.ok) { $('discBox').innerHTML = `<div class="err">${esc(c.body.error)}</div>`; return; }
  currentQuote = c.body.quote;
  const s = await api(`/api/quotes/${currentQuote.id}/send`, { method: 'POST' });
  currentQuote = s.body.quote || currentQuote;
  $('quoteStatus').className = 'status-pill ' + currentQuote.status;
  $('quoteStatus').textContent = currentQuote.status;
  $('discBox').innerHTML = `<div class="card">
    <h3>${s.body.dryRun ? '预览模式：未真正发出邮件' : '已发送'}</h3>
    <p class="hint">${s.body.dryRun
      ? '未配置 SMTP 凭据，系统不会发起任何网络请求。这是发送闸门的第二道防线（第一道是服务端状态机）。'
      : '报价已作为 HTML 邮件发送到该公司报价邮箱，四视图以 CID 内嵌，并附带纯文本与图片附件兜底。'}</p>
    ${s.body.billingEventId ? `<p class="hint">已记录计费事件 ${esc(s.body.billingEventId)}</p>` : ''}
    ${s.body.billingSuppressed ? '<p class="hint">命中 30 天去重窗口：邮件照发，但不重复计费。</p>' : ''}
    ${s.body.attachedPdf ? '<p class="hint">正式报价单 PDF 已作为附件一并发出。</p>' : ''}
    ${(s.body.pdfWarnings || []).map((w) => `<p class="err">${esc(w)}</p>`).join('')}
  </div>`;
}

// ── 主动拉取选择题 ──
$('prefBtn').addEventListener('click', async () => {
  const companyId = $('companySel').value;
  const { body } = await api(
    `/api/conversations/${conversationId}/questions?companyId=${encodeURIComponent(companyId)}`);
  if (!body.questions?.length) {
    addMsg('system', '价格与偏好方面暂时没有需要你选的了。');
    if (body.note) addMsg('system', body.note);
    return;
  }
  if (body.note) addMsg('system', body.note);
  renderQuestions(body.questions, companyId);
});

// ── 比价 ──
$('cmpBtn').addEventListener('click', async () => {
  const { body } = await api(`/api/conversations/${conversationId}/comparison`);
  const cmp = body.comparison;
  if (!cmp || cmp.rows.length === 0) {
    $('content').innerHTML = '<p class="hint">还没有可对比的报价。先为不同公司各出一版方案与报价。</p>';
    return;
  }
  const rows = cmp.rows.map((r, i) => `<tr>
    <td>${esc(r.companyName)}${i === 0 ? ' <span class="cmp-lowest">★ 最低</span>' : ''}</td>
    <td class="num">${money(r.netBeforeTax)}</td>
    <td class="num">${money(r.shipping)}</td>
    <td class="num">${money(r.taxTotal)}</td>
    <td class="num">${money(r.total)}</td>
    <td class="num">${r.deltaFromLowest === 0 ? '—' : '+' + money(r.deltaFromLowest)}</td></tr>`).join('');
  const warns = (cmp.warnings || []).map((w) => `<div class="err">· ${esc(w.message)}</div>`).join('');
  $('content').innerHTML = `
    <div class="card">
      <h3>多家报价对比</h3>
      <table><thead><tr><th>公司</th><th class="num">未税小计</th><th class="num">运费</th>
        <th class="num">税</th><th class="num">总计</th><th class="num">差额</th></tr></thead>
        <tbody>${rows}</tbody></table>
      ${warns}
      <p class="hint" style="margin-top:10px">本表只比价格，不做图纸对比。各家的设计方案请分别查看。</p>
    </div>`;
});

boot();
</script>
</body>
</html>
